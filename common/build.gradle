workspaceDependencies {
	siblingMaven('BrainageLib') {
		coordinate.set("io.github.brainage04:brainagelib:${rootProject.brainagelib_version}")
		siblingDirectory.set(rootProject.layout.projectDirectory.dir('../BrainageLib'))
	}
}

repositories {
	exclusiveContent {
		forRepository { maven { url = "https://repo.spongepowered.org/repository/maven-public/" } }
		filter { includeGroup "org.spongepowered" }
	}
}

dependencies {
	compileOnly "io.github.brainage04:brainagelib:${rootProject.brainagelib_version}"
	compileOnly 'org.spongepowered:mixin:0.8.5'
}
